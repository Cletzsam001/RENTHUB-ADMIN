<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentHub Admin Login</title>
  <link rel="stylesheet" href="renthub-admin-styles.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      font-family: Inter, Arial, sans-serif;
    }
    .login-card {
      width: min(420px, 90%);
      padding: 32px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 30px #00000012;
    }
    .login-card h1 { color: #004f79; }
    .login-card label {
      display: block;
      margin-top: 18px;
      font-weight: 600;
    }
    .login-card input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccd5df;
      border-radius: 7px;
    }
    .login-card button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: 0;
      border-radius: 7px;
      background: #2557e5;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    #login-message {
      margin-top: 14px;
      color: #b42318;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>RentHub Admin</h1>
    <p>Sign in to manage RentHub.</p>

    <form id="admin-login-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
        autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
        autocomplete="current-password" required>

      <button id="login-button" type="submit">Sign in</button>
      <p id="login-message" role="alert"></p>
    </form>
  </main>

  <script src="renthub-admin-auth.js"></script>
</body>
</html>
